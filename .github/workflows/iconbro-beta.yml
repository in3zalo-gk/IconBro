name: IconBro Android 14 Beta

on:
  push:
    branches: [main, development]
    tags:
      - 'iconbro-v*-beta.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconbro-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-36-ext1" "build-tools;36.0.0"

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release APK (debug key unless project secrets are configured)
        run: ./gradlew --no-daemon assembleRelease

      - name: Validate APK, package, SDK metadata, signature and checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKANALYZER="$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          if [[ ! -x "$APKANALYZER" ]]; then APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -print -quit)"; fi
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          MIN_SDK="$("$APKANALYZER" manifest min-sdk "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          VERSION="$("$APKANALYZER" manifest version-name "$APK")"
          echo "applicationId=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "minSdk=$MIN_SDK targetSdk=$TARGET_SDK version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$APP_ID" = "dev.iconbro"
          test "$MIN_SDK" = "34"
          test "$TARGET_SDK" = "34"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/IconBro-Android14-Beta.apk"
          (cd dist && sha256sum IconBro-Android14-Beta.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconBro-Android14-Beta
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Pre-release for Beta tag
        if: startsWith(github.ref, 'refs/tags/iconbro-v')
        uses: softprops/action-gh-release@v2
        with:
          name: IconBro ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Experimental community fork based on Iconify v8.0.0 (`1aad7e414ade5c5af8a057004ee24dbae366fe26`), compared against v7.3.0 (`ee491e884487959d364f07797c60adcd984ea948`).

            Android 14 support is unverified. The v8 system module still explicitly requires SDK 36; do not install its system module on API 34. ROM/vendor/root-framework dependent features may fail. No Moto G24 stock-firmware validation is claimed.

            APK package: `${{ steps.validate.outputs.applicationId }}`; `${{ steps.validate.outputs.minSdk }}`.
          files: |
            dist/IconBro-Android14-Beta.apk
            dist/SHA256SUMS.txt
