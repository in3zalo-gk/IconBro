name: IconBro Android 14 Beta

on:
  push:
    branches: [main, development]
    tags:
      - 'iconbro-v*-beta.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iconbro-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          test -n "$TOOL"
          "$TOOL" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release APK (debug key unless project secrets are configured)
        run: ./gradlew --no-daemon assembleRelease

      - name: Validate APK, package, SDK metadata, signature and checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKANALYZER="$SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          if [[ ! -x "$APKANALYZER" ]]; then APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -print -quit)"; fi
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          MIN_SDK="$("$APKANALYZER" manifest min-sdk "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          VERSION="$("$APKANALYZER" manifest version-name "$APK")"
          echo "applicationId=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "minSdk=$MIN_SDK targetSdk=$TARGET_SDK version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$APP_ID" = "dev.iconbro"
          test "$MIN_SDK" = "34"
          test "$TARGET_SDK" = "34"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/IconBro-Android14-Beta.apk"
          (cd dist && sha256sum IconBro-Android14-Beta.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconBro-Android14-Beta
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Pre-release for Beta tag
        if: startsWith(github.ref, 'refs/tags/iconbro-v')
        uses: softprops/action-gh-release@v2
        with:
          name: IconBro ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            **Unofficial community fork:** IconBro, maintained at https://github.com/in3zalo-gk/IconBro, based on Iconify v8.0.0 (`1aad7e414ade5c5af8a057004ee24dbae366fe26`) with Android 14 backports informed by v7.3.0 (`ee491e884487959d364f07797c60adcd984ea948`).

            This IconBro fork explicitly enables its onboarding and module installer on Android 14 (API 34) and Android 16 QPR1+ (API 36+). Android 14 remains experimental and ROM/vendor/root-framework dependent; no Moto G24 stock-firmware validation is claimed. Xposed bootloop protection skips hooks after repeated crashes, but does not disable unrelated root modules or all overlays.

            APK package: `${{ steps.validate.outputs.applicationId }}`; `${{ steps.validate.outputs.minSdk }}`.
          files: |
            dist/IconBro-Android14-Beta.apk
            dist/SHA256SUMS.txt
